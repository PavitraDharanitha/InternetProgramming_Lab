<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
    font-family:Arial, Helvetica, sans-serif;
    background-image:url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuv08kUFWODRN662YidqZqjUbZWADhcX9W_luuaNcoRw&s=10");
    background-size:cover;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

h1{
    color:darkblue;
    text-shadow:3px 3px 5px gray;
}

a{
    text-decoration:none;
    color:blue;
    font-size:20px;
    font-weight:bold;
}

a:hover{
    color:red;
}

fieldset{
    width:35%;
    background:white;
    border:4px solid darkblue;
    padding:20px;
}

legend{
    color:darkblue;
    font-size:22px;
    font-weight:bold;
}

input{
    width:90%;
    padding:10px;
    font-size:16px;
}

input[type="submit"]{
    width:120px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}

input[type="reset"]{
    width:120px;
    background:red;
    color:white;
    border:none;
    cursor:pointer;
}

input[type="submit"]:hover{
    background:darkgreen;
}

input[type="reset"]:hover{
    background:darkred;
}
</style>

</head>

<body>

<center>

<h1>User Login</h1>

<hr width="80%">

<a href="index.html">Home</a> |
<a href="register.html">Register</a>

<hr width="80%">

<fieldset>

<legend>Login Here</legend>

<form>

<label><b>Username</b></label><br>
<input type="text" placeholder="Enter Username" required>

<br><br>

<label><b>Password</b></label><br>
<input type="password" placeholder="Enter Password" required>

<br><br>

<input type="submit" value="Login">
<input type="reset" value="Clear">

</form>

</fieldset>

<br>

<p>
Don't have an account?
<a href="register.html">Register Here</a>
</p>

</center>

</body>
</html>
