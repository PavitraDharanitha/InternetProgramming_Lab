<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPkVQ35oE0ydpYvxzIW1-de9WhdAwfQtUshnDkH6H2SL4bLKTrI4w3bhw&s=10');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .container {
            max-width: 450px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: white;
            text-shadow: 3px 3px 5px gray;
            font-size: 36px;
        }

        .nav-links a {
            text-decoration: none;
            color: blue;
            font-size: 18px;
            font-weight: bold;
            margin: 0 10px;
        }

        form {
            background: white;
            width: 100%;
            box-sizing: border-box;
            border: 4px solid darkblue;
            padding: 25px;
            margin-top: 20px;
            border-radius: 15px;
            box-shadow: 5px 5px 15px gray;
            text-align: left;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid gray;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 3px;
            margin-bottom: 10px;
        }

        .success-msg {
            color: green;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
        }

        button[type="submit"] {
            background: green;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background: #006400;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>User Registration</h1>
    <hr width="80%">

    <div class="nav-links">
        <a href="index.html">Home</a> | 
        <a href="login.html">Login</a>
    </div>

    <hr width="80%">

    <form id="regForm">
        <label for="name">Name</label><br>
        <input type="text" id="name" placeholder="Enter Name">
        <div id="nameError" class="error"></div>

        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="Enter Email">
        <div id="emailError" class="error"></div>

        <label for="phone">Phone Number</label><br>
        <input type="text" id="phone" placeholder="Enter Phone Number" inputmode="numeric">
        <div id="phoneError" class="error"></div>

        <label for="password">Password</label><br>
        <input type="password" id="password" placeholder="Enter Password">
        <div id="passwordError" class="error"></div>

        <label for="confirmPassword">Confirm Password</label><br>
        <input type="password" id="confirmPassword" placeholder="Confirm password">
        <div id="confirmPasswordError" class="error"></div>

        <button type="submit">Register</button>
        <div id="formSuccess" class="success-msg"></div>
    </form>

    <br>
    <p style="font-size:18px; background: rgba(255, 255, 255, 0.8); padding: 10px; border-radius: 5px;">
        Already Registered? 
        <a href="login.html" style="text-decoration:none; color:red; font-weight:bold;">Login Here</a>
    </p>
</div>

<script>
    const form = document.getElementById("regForm");
    
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const phoneInput = document.getElementById("phone");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    const nameError = document.getElementById("nameError");
    const emailError = document.getElementById("emailError");
    const phoneError = document.getElementById("phoneError");
    const passwordError = document.getElementById("passwordError");
    const confirmPasswordError = document.getElementById("confirmPasswordError");
    const formSuccess = document.getElementById("formSuccess");

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        
        // Reset errors and success message
        nameError.textContent = "";
        emailError.textContent = "";
        phoneError.textContent = "";
        passwordError.textContent = "";
        confirmPasswordError.textContent = "";
        formSuccess.textContent = "";

        let isValid = true;

        // 1. Name Validation
        const nameVal = nameInput.value.trim();
        if (nameVal === "") {
            nameError.textContent = "Please enter your name.";
            isValid = false;
        } else if (!/^[A-Za-z ]+$/.test(nameVal)) {
            nameError.textContent = "Name can only contain letters and spaces.";
            isValid = false;
        }

        // 2. Email Validation
        const emailVal = emailInput.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (emailVal === "") {
            emailError.textContent = "Please enter your email.";
            isValid = false;
        } else if (!emailRegex.test(emailVal)) {
            emailError.textContent = "Please enter a valid email address.";
            isValid = false;
        }

        // 3. Phone Validation
        const phoneVal = phoneInput.value.trim();
        if (phoneVal === "") {
            phoneError.textContent = "Please enter your phone number.";
            isValid = false;
        } else if (!/^\d{10}$/.test(phoneVal)) {
            phoneError.textContent = "Phone number must be exactly 10 digits.";
            isValid = false;
        }

        // 4. Password Validation
        const passwordVal = passwordInput.value;
        if (passwordVal === "") {
            passwordError.textContent = "Please enter a password.";
            isValid = false;
        } else if (passwordVal.length < 6) {
            passwordError.textContent = "Password must be at least 6 characters long.";
            isValid = false;
        }

        // 5. Confirm Password Validation
        const confirmVal = confirmPasswordInput.value;
        if (confirmVal === "") {
            confirmPasswordError.textContent = "Please confirm your password.";
            isValid = false;
        } else if (confirmVal !== passwordVal) {
            confirmPasswordError.textContent = "Passwords do not match.";
            isValid = false;
        }

        // If everything is valid
        if (isValid) {
            formSuccess.textContent = "Registration Successful! Redirecting...";
            setTimeout(() => {
                form.reset();
                // window.location.href = "login.html"; // Uncomment to redirect to login
            }, 1500);
        }
    });
</script>

</body>
</html>
